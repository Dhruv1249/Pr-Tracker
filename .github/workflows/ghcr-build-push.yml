name: Build and Push to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'auth/**'
      - 'backend/**'
      - 'ai-agent/**'
      - 'mongodb/**'
      - 'service-router/**'
      - 'frontend/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: dhruv1249/pr-tracker

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      backend: ${{ steps.filter.outputs.backend }}
      ai-agent: ${{ steps.filter.outputs.ai-agent }}
      mongodb: ${{ steps.filter.outputs.mongodb }}
      service-router: ${{ steps.filter.outputs.service-router }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'auth/**'
            backend:
              - 'backend/**'
            ai-agent:
              - 'ai-agent/**'
            mongodb:
              - 'mongodb/**'
            service-router:
              - 'service-router/**'
            frontend:
              - 'frontend/**'

  build-auth:
    needs: changes
    if: needs.changes.outputs.auth == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./auth
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-auth:latest

  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-backend:latest

  build-ai-agent:
    needs: changes
    if: needs.changes.outputs.ai-agent == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./ai-agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-ai-agent:latest

  build-mongodb:
    needs: changes
    if: needs.changes.outputs.mongodb == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./mongodb
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-mongodb:latest

  build-service-router:
    needs: changes
    if: needs.changes.outputs.service-router == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./service-router
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-service-router:latest

  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-frontend:latest

  cleanup:
    needs: [build-auth, build-backend, build-ai-agent, build-mongodb, build-service-router, build-frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Delete old untagged images
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'pr-tracker-auth'
          package-type: 'container'
          min-versions-to-keep: 1
          delete-only-untagged-versions: 'true'
          token: ${{ secrets.GH_PAT_CLEANUP }}
      - uses: actions/delete-package-versions@v5
        with:
          package-name: 'pr-tracker-backend'
          package-type: 'container'
          min-versions-to-keep: 1
          delete-only-untagged-versions: 'true'
          token: ${{ secrets.GH_PAT_CLEANUP }}
      - uses: actions/delete-package-versions@v5
        with:
          package-name: 'pr-tracker-ai-agent'
          package-type: 'container'
          min-versions-to-keep: 1
          delete-only-untagged-versions: 'true'
          token: ${{ secrets.GH_PAT_CLEANUP }}
      - uses: actions/delete-package-versions@v5
        with:
          package-name: 'pr-tracker-mongodb'
          package-type: 'container'
          min-versions-to-keep: 1
          delete-only-untagged-versions: 'true'
          token: ${{ secrets.GH_PAT_CLEANUP }}
      - uses: actions/delete-package-versions@v5
        with:
          package-name: 'pr-tracker-service-router'
          package-type: 'container'
          min-versions-to-keep: 1
          delete-only-untagged-versions: 'true'
          token: ${{ secrets.GH_PAT_CLEANUP }}
      - uses: actions/delete-package-versions@v5
        with:
          package-name: 'pr-tracker-frontend'
          package-type: 'container'
          min-versions-to-keep: 1
          delete-only-untagged-versions: 'true'
          token: ${{ secrets.GH_PAT_CLEANUP }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent
  template:
    metadata:
      labels:
        app: ai-agent
    spec:
      containers:
      - name: ai-agent
        image: ghcr.io/dhruv1249/pr-tracker-ai-agent:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5001
        env:
        - name: PORT
          value: "5001"
        - name: PROXY_URL
          value: "http://service-router:5003"
        - name: CORE_SERVICE_URL
          value: "http://backend:5002"
        - name: MISTRAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: pr-tracker-secrets
              key: mistral-api-key
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent
spec:
  selector:
    app: ai-agent
  ports:
  - protocol: TCP
    port: 5001
    targetPort: 5001

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pr-tracker-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: service-router
            port:
              number: 5003
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 5173

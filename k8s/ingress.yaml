apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pr-tracker-ingress
  namespace: jenkins
  annotations:
    traefik.ingress.kubernetes.io/service.nativelb: "true"

spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: service-router
                port:
                  number: 5003
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
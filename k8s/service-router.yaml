apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-router
  template:
    metadata:
      labels:
        app: service-router
    spec:
      containers:
      - name: service-router
        image: ghcr.io/dhruv1249/pr-tracker-service-router:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5003
        env:
        - name: PORT
          value: "5003"
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: pr-tracker-config
              key: node-env
        - name: AUTH_SERVICE_URL
          value: "http://auth:5005"
        - name: CORE_SERVICE_URL
          value: "http://backend:5002"
        - name: AI_SERVICE_URL
          value: "http://ai-agent:5001"
        - name: DB_SERVICE_URL
          value: "http://mongodb:5004"
        - name: CLIENT_URL
          valueFrom:
            configMapKeyRef:
              name: pr-tracker-config
              key: client-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: pr-tracker-secrets
              key: jwt-secret
        - name: GITHUB_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: pr-tracker-secrets
              key: github-webhook-secret
        - name: INTERNAL_SECRET
          valueFrom:
            secretKeyRef:
              name: pr-tracker-secrets
              key: internal-secret
---
apiVersion: v1
kind: Service
metadata:
  name: service-router
  annotations:
    traefik.ingress.kubernetes.io/service.nativelb: "true"
spec:
  selector:
    app: service-router
  ports:
  - name: http
    protocol: TCP
    port: 5003
    targetPort: 5003
